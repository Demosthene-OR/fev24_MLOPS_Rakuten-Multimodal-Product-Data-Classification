events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 7860;

        # STREAMLIT (Root)
        location / {
            proxy_pass http://127.0.0.1:8501/;
            proxy_set_header        Host $host;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # STREAMLIT HEALTHZ (Optional)
        location /_stcore/health {
            proxy_pass http://127.0.0.1:8501/_stcore/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        
        # STREAMLIT VENDOR/STATIC (Sometimes needed for complex setups)
        # Streamlit usually handles its own static assets fine if root is /

        # ADMINER
        location /adminer/ {
            alias /var/www/html/adminer/;
            index index.php;
            try_files $uri $uri/ /index.php$is_args$args;

            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass unix:/run/php/php8.2-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $request_filename;
            }
        }

        # TENSORBOARD
        location /tensorboard/ {
            proxy_pass http://127.0.0.1:6006/tensorboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # AIRFLOW
        location /airflow/ {
            proxy_pass http://127.0.0.1:8080/airflow/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
